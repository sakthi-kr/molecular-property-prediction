name: Molecular property prediction tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install source and optional app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ml,app]'
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile sources and tests
        run: python -m compileall -q src tests scripts
      - name: Run all offline tests
        run: python -m pytest -q -rs
      - name: Check published file hygiene
        run: python scripts/check_repository.py
